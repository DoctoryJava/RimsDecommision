version: '3.8'

services:
  # SQL Server 元数据库
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rims-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Qq4188.1"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # 镜像自 2019-CU28 起 sqlcmd 位于 /opt/mssql-tools18，且需 -C 跳过自签证书校验
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rims-network

  # 建库容器：SQL Server 镜像没有 /docker-entrypoint-initdb.d 机制，
  # 只负责 CREATE DATABASE；建表与初始化数据由后端启动时的 Flyway
  # （classpath:db/migration/sqlserver）完成。执行完即退出。
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rims-sqlserver-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Qq4188.1" -C -b
      -Q "IF DB_ID('RimsDecommission') IS NULL CREATE DATABASE [RimsDecommission];"
    networks:
      - rims-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: rims-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123456
    volumes:
      - redis_data:/data
    networks:
      - rims-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rims-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SQLSERVER_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=RimsDecommission;encrypt=true;trustServerCertificate=true;loginTimeout=30"
      SQLSERVER_USERNAME: sa
      SQLSERVER_PASSWORD: "Qq4188.1"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123456
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - rims-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rims-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rims-network

volumes:
  sqlserver_data:
  redis_data:

networks:
  rims-network:
    driver: bridge
