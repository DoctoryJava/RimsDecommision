spring:
  datasource:
    # 测试用 H2 走 SQL Server 兼容模式（方括号标识符、NVARCHAR 等），与生产 SQL Server 语法对齐
    url: jdbc:h2:mem:rims_test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    hibernate:
      ddl-auto: none

app:
  mock:
    databricks: true
    storage: true
