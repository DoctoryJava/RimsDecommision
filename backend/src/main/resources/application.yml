server:
  port: 8088
  servlet:
    context-path: /
  # Tomcat 默认请求头上限 8KB。本地开发时 localhost 上其他项目写入的 Cookie 会被
  # 一并发到本服务（Cookie 不按端口隔离，见 RFC 6265），容易顶破 8KB 导致
  # "Request header is too large"。放宽到 32KB。
  max-http-request-header-size: 32KB

spring:
  datasource:
    # 元数据库：SQL Server。可通过 SQLSERVER_URL/SQLSERVER_USERNAME/SQLSERVER_PASSWORD 环境变量覆盖。
    # 本地 Docker 实例示例：
    #   docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=Qq4188.1" \
    #     -p 1433:1433 --name sql1 --hostname sql1 -d mcr.microsoft.com/mssql/server:2025-latest
    # 首次使用需先手工建库：CREATE DATABASE RimsDecommission;
    url: ${SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=RimsDecommission;encrypt=true;trustServerCertificate=true;loginTimeout=10}
    username: ${SQLSERVER_USERNAME:sa}
    password: ${SQLSERVER_PASSWORD:Qq4188.1}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    # SQL Server 版迁移脚本目录（MySQL 版保留在 db/migration/mysql 下作为历史参考）
    locations: classpath:db/migration/sqlserver
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.rims.decommission.entity

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-prod-32chars-min-length!!}
    expiration-ms: 86400000
  databricks:
    host: ${DATABRICKS_HOST:https://mock.databricks.net}
    token: ${DATABRICKS_TOKEN:mock-token}
    warehouse-id: ${DATABRICKS_WAREHOUSE_ID:mock-warehouse}
    catalog: lake
  # SeaTunnel 同步引擎配置（同步源库 -> 本地磁盘 Iceberg）
  seatunnel:
    home: ${SEATUNNEL_HOME:/Users/chenyong/Desktop/BigData/apache-seatunnel-2.3.13}
    # 本地磁盘 Iceberg warehouse 根路径（模拟存储桶）
    warehouse-dir: ${SEATUNNEL_WAREHOUSE_DIR:/Users/chenyong/Desktop/BigData/archive}
    conf-dir: ${SEATUNNEL_CONF_DIR:/Users/chenyong/Desktop/BigData/archive/.conf}
    # 是否真正调用 SeaTunnel（true 时调用 seatunnel.sh 执行真实同步）
    enabled: ${SEATUNNEL_ENABLED:true}
  # Spark 查询引擎（读已同步的 Iceberg 落盘数据）
  spark:
    home: ${SPARK_HOME:/Users/chenyong/Desktop/BigData/spark-3.3.4-bin-hadoop3}
    # Iceberg 落盘 warehouse 根路径（与 seatunnel.warehouse-dir 一致）
    warehouse-dir: ${SPARK_WAREHOUSE_DIR:/Users/chenyong/Desktop/BigData/archive}
    # Iceberg spark runtime 依赖（匹配 spark 3.3 / scala 2.12）
    iceberg-package: ${SPARK_ICEBERG_PACKAGE:org.apache.iceberg:iceberg-spark-runtime-3.3_2.12:1.4.3}
    # 是否真正调用 Spark（false 时返回模拟数据，便于无环境调试）
    enabled: ${SPARK_QUERY_ENABLED:true}
    # Iceberg spark runtime jar 本地路径（spark-submit --jars 注入）
    iceberg-jar: ${SPARK_ICEBERG_JAR:/Users/chenyong/.ivy2/cache/org.apache.iceberg/iceberg-spark-runtime-3.3_2.12/jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar}
    # 独立 Spark SQL 查询作业 jar（javac 编译的 scripts/spark/rims-spark-query.jar）
    query-job-jar: ${SPARK_QUERY_JOB_JAR:/Users/chenyong/Desktop/LLM-AI/RimsDecommision/scripts/spark/rims-spark-query.jar}
    # Iceberg catalog 名（设为 defaultCatalog，SQL 可省略 catalog 前缀）
    catalog-name: ${SPARK_CATALOG_NAME:rims}
    # Spark 子进程专用 JDK（Spark 3.3 仅支持 JDK ≤11；后端运行于 17+，故进程隔离）
    java-home: ${SPARK_JAVA_HOME:/Library/Java/JavaVirtualMachines/jdk-11.jdk/Contents/Home}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rims.decommission: DEBUG
    org.springframework.security: INFO
