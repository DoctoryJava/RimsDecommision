server:
  port: 8088
  servlet:
    context-path: /

spring:
  datasource:
    # 生产/开发 MySQL 连接（AiCoder）。可通过 MYSQL_URL/MYSQL_USERNAME/MYSQL_PASSWORD 环境变量覆盖。
    url: ${MYSQL_URL:jdbc:mysql://cq-cdb-9bf4xslt.sql.tencentcdb.com:63819/AiCoder?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:AiCoder}
    password: ${MYSQL_PASSWORD:AiCoder@2025}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.rims.decommission.entity

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-prod-32chars-min-length!!}
    expiration-ms: 86400000
  databricks:
    host: ${DATABRICKS_HOST:https://mock.databricks.net}
    token: ${DATABRICKS_TOKEN:mock-token}
    warehouse-id: ${DATABRICKS_WAREHOUSE_ID:mock-warehouse}
    catalog: lake
  # SeaTunnel 同步引擎配置（同步源库 -> 本地磁盘 Iceberg）
  seatunnel:
    home: ${SEATUNNEL_HOME:/Users/chenyong/Desktop/BigData/apache-seatunnel-2.3.13}
    # 本地磁盘 Iceberg warehouse 根路径（模拟存储桶）
    warehouse-dir: ${SEATUNNEL_WAREHOUSE_DIR:/Users/chenyong/Desktop/BigData/archive}
    conf-dir: ${SEATUNNEL_CONF_DIR:/Users/chenyong/Desktop/BigData/archive/.conf}
    # 是否真正调用 SeaTunnel（true 时调用 seatunnel.sh 执行真实同步）
    enabled: ${SEATUNNEL_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rims.decommission: DEBUG
    org.springframework.security: INFO
