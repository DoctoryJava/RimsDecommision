spring:
  datasource:
    url: jdbc:h2:mem:rims_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

# dev 模式跳过真实 Databricks/ADLS，连通性测试返回 mock
app:
  mock:
    databricks: true
    storage: true
